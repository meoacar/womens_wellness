version: '3.8'

services:
  # PostgreSQL Database (internal Docker network only; never exposed on host)
  postgres:
    image: postgres:15-alpine
    container_name: wellness-db
    restart: always
    environment:
      POSTGRES_USER: wellness
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: wellness
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - wellness_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (internal Docker network only; never exposed on host)
  redis:
    image: redis:7-alpine
    container_name: wellness-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - wellness_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend (internal; reachable externally only via Nginx HTTPS)
  api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-meoacar/womens_wellness}-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: wellness-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ${ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: production
      PORT: 4000
      API_BASE_URL: ${API_BASE_URL:-https://api.kadinatlasi.com}
      APP_URL: ${APP_URL:-https://kadinatlasi.com}
      ASTROLOGY_SERVICE_URL: ${ASTROLOGY_SERVICE_URL:-http://astrology:5000}
      UPLOADS_DIR: /app/apps/api/uploads
      DATABASE_URL: postgresql://wellness:${DB_PASSWORD}@postgres:5432/wellness
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_OAUTH_AUDIENCES: ${GOOGLE_OAUTH_AUDIENCES:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      APPLE_SHARED_SECRET: ${APPLE_SHARED_SECRET:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.kadinatlasi.wellness}
      APPLE_ENVIRONMENT: ${APPLE_ENVIRONMENT:-}
      APPLE_ROOT_CA_CERTS: ${APPLE_ROOT_CA_CERTS:-}
      APPLE_ROOT_CA_PEM: ${APPLE_ROOT_CA_PEM:-}
      APPLE_ROOT_CA_PATH: ${APPLE_ROOT_CA_PATH:-}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${GOOGLE_SERVICE_ACCOUNT_KEY:-}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.kadinatlasi.wellness}
      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID:-}
      GOOGLE_PUBSUB_AUDIENCE: ${GOOGLE_PUBSUB_AUDIENCE:-}
      GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_PUBSUB_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PUBSUB_PUSH_TOKEN: ${GOOGLE_PUBSUB_PUSH_TOKEN:-}
      SUBSCRIPTION_CURRENCY: ${SUBSCRIPTION_CURRENCY:-TRY}
      SKIP_WEBHOOK_VERIFICATION: "false"
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@kadinatlasi.com}
      SMTP_TLS: ${SMTP_TLS:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_FAILURE_THRESHOLD: ${ALERT_FAILURE_THRESHOLD:-3}
      ALERT_COOLDOWN_MS: ${ALERT_COOLDOWN_MS:-300000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${CORS_ORIGINS:-}}
      CORS_ORIGINS: ${CORS_ORIGINS:-${CORS_ALLOWED_ORIGINS:-}}
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
    expose:
      - "4000"
    networks:
      - wellness_internal
    volumes:
      - uploads_data:/app/apps/api/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin Panel (internal; reachable externally only via Nginx HTTPS)
  admin:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-meoacar/womens_wellness}-admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.kadinatlasi.com}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-https://kadinatlasi.com}
    container_name: wellness-admin
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.kadinatlasi.com}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-https://kadinatlasi.com}
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - wellness_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Public Web Site (internal; reachable externally only via Nginx HTTPS on kadinatlasi.com)
  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-meoacar/womens_wellness}-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.kadinatlasi.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kadinatlasi.com}
    container_name: wellness-web
    restart: always
    depends_on:
      - api
    environment:
      INTERNAL_API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.kadinatlasi.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kadinatlasi.com}
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - wellness_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Astrology Service (internal Docker network only)
  astrology:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-meoacar/womens_wellness}-astrology:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/astrology-service/Dockerfile
      target: production
    container_name: wellness-astrology
    restart: always
    environment:
      PORT: 5000
      FLASK_ENV: production
    expose:
      - "5000"
    networks:
      - wellness_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (sole public ingress: HTTP->HTTPS redirect + TLS termination)
  nginx:
    image: nginx:alpine
    container_name: wellness-nginx
    restart: always
    depends_on:
      - api
      - admin
      - web
      - astrology
    ports:
      - "80:80"
      - "443:443"
    networks:
      - wellness_internal
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  wellness_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
